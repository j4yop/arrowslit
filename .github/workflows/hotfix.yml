name: Hotfix build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Tests
        run: swift test --build-system native

      - name: Build universal app
        env:
          CONFIG: release
          VERSION: "0.2.0"
          BUILD_NUMBER: "9"
          UNIVERSAL: "1"
        run: ./Scripts/build-app.sh

      - name: Verify architectures
        run: |
          lipo -info build/Arrowslit.app/Contents/MacOS/Arrowslit
          lipo -info build/Arrowslit.app/Contents/Frameworks/libArrowslitMedia.dylib
          archs="$(lipo -archs build/Arrowslit.app/Contents/MacOS/Arrowslit)"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent "build/Arrowslit.app" build/Arrowslit.zip

      - name: Package DMG
        env:
          SKIP_BUILD: "1"
        run: ./Scripts/make-dmg.sh

      - name: Verify DMG
        run: |
          hdiutil verify build/Arrowslit.dmg
          shasum -a 256 build/Arrowslit.dmg

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: arrowslit-release
          path: |
            build/Arrowslit.zip
            build/Arrowslit.dmg
            build/Arrowslit.dmg.sha256
          if-no-files-found: error
